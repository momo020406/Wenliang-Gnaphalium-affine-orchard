<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>文亮木鱉果園 - 即時儀表板 v1.2</title>
<style>
:root{
  --bg:#CDEDC7;
  --panel:#245953;
  --tile:#E7F6E7;
  --text:#0B2D2A;
  --num:#0f172a;
  --ok:#16a34a;
  --radius:18px;
  --gap:14px;
}
html,body{
  height:100%;
  margin:0;
  background:var(--bg);
  font-family:"Microsoft JhengHei",system-ui,sans-serif;
  color:var(--text);
}
.wrap{
  max-width:1280px;
  margin:auto;
  padding:18px;
}
header{
  display:grid;
  gap:var(--gap);
  grid-template-columns:1.2fr 1fr 1.2fr;
  align-items:stretch;
}
.title{
  background:#e8f7ee;
  border:4px solid var(--panel);
  border-radius:var(--radius);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:12px;
}
.title h1{
  margin:6px 0 2px 0;
  font-size:44px;
  letter-spacing:4px;
}
.clock,.datebox{
  background:#fff;
  border:4px solid var(--panel);
  border-radius:var(--radius);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  font-weight:700;
}
.clock{font-size:46px;}
.datebox{font-size:36px;font-weight:800;}

.top-panels{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:var(--gap);
  margin-top:var(--gap);
  align-items:stretch;
}
.panel{
  background:#fff;
  border:4px solid var(--panel);
  border-radius:var(--radius);
  padding:12px;
  min-height:230px;
}
.panel h2{
  margin:0 0 8px 0;
  font-size:28px;
  line-height:1.25;
}
.weather-title{line-height:1.3;}
.source-note{
  font-size:55%;
  color:#444;
  font-weight:500;
  margin-left:4px;
}
.mobile-break{display:none;}

.weather-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 12px;
  background:var(--tile);
  border-radius:14px;
  padding:18px;
  align-items:center;
  justify-items:start;
  min-height:136px;
}
.weather-cell{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:22px;
  font-weight:700;
  line-height:1.4;
}
.weather-cell img{
  width:36px;
  height:36px;
}

.sensor-grid{
  display:grid;
  grid-template-columns:1fr 1px 1fr;
  gap:18px;
  background:var(--tile);
  border-radius:14px;
  padding:16px 18px;
  min-height:136px;
  align-items:center;
}
.sensor-divider{
  width:1px;
  height:115px;
  background:#8ab58a;
  border-left:1px dashed #7ca77c;
}
.station-card{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px 14px;
  align-items:center;
  justify-items:center;
}
.station-badge{
  grid-column:1 / -1;
  background:var(--ok);
  color:#fff;
  border-radius:999px;
  padding:4px 28px;
  font-size:20px;
  font-weight:900;
  line-height:1.1;
}
.sensor-item{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--num);
}
.sensor-item img{
  width:42px;
  height:42px;
}
.sensor-label{
  font-size:20px;
  font-weight:800;
  white-space:nowrap;
}
.sensor-value{
  display:block;
  font-size:38px;
  font-weight:900;
  line-height:1.1;
  margin-top:3px;
}

.table-wrap{
  margin-top:var(--gap);
  background:#fff;
  border:4px solid var(--panel);
  border-radius:var(--radius);
  padding:14px;
}
.table-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  flex-wrap:wrap;
  gap:10px;
}
.table-title h3{
  margin:0;
  font-size:26px;
}
.depth-buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.btn{
  background:var(--panel);
  color:#fff;
  border:none;
  border-radius:999px;
  padding:10px 0;
  width:130px;
  font-size:20px;
  font-weight:800;
  cursor:pointer;
  letter-spacing:1px;
  text-align:center;
}
.btn:active{transform:translateY(1px);}

table{
  width:100%;
  border-collapse:separate;
  border-spacing:0 10px;
}
thead th{
  font-size:17px;
  color:#334155;
  text-align:center;
  line-height:1.35;
}
tbody td,thead th{
  padding:10px 8px;
}
tbody tr{
  background:var(--tile);
}
tbody tr td{
  font-size:22px;
  text-align:center;
  font-weight:700;
  color:var(--num);
}
tbody tr td:first-child{
  font-weight:800;
  color:#1f2937;
}
.footer-line{
  color:#2563eb;
  font-size:15px;
  margin-top:10px;
  text-align:center;
  border-top:2px solid #a3bfa3;
  padding-top:6px;
}
.warn{color:#dc2626;font-weight:900;}
.unit{
  display:block;
  font-size:13px;
  color:#64748b;
  font-weight:700;
}

@media (max-width:768px){
  header{grid-template-columns:1fr !important;}
  .title h1{font-size:32px;}
  .clock{font-size:32px;}
  .datebox{font-size:24px;}
  .top-panels{grid-template-columns:1fr;}
  .panel{min-height:auto;}
  .weather-grid{grid-template-columns:1fr;min-height:auto;}
  .sensor-grid{grid-template-columns:1fr;min-height:auto;}
  .sensor-divider{display:none;}
  .station-card{grid-template-columns:1fr;}
  .sensor-item{justify-content:center;}
  tbody tr td{font-size:17px;}
  thead th{font-size:14px;}
  .table-title{flex-direction:column;align-items:center;gap:12px;}
  .mobile-break{display:block;}
  .source-note{display:block;text-align:right;margin-top:2px;}
  .btn{width:120px;font-size:18px;}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="datebox" id="dateBox">--</div>
    <div class="title">
      <h1>文亮木鱉果園</h1>
      <small>Real-time Dashboard</small>
    </div>
    <div class="clock"><div id="mainClock">00:00:00</div></div>
  </header>

  <div class="top-panels">
    <section class="panel">
      <h2 class="weather-title">
        彰化 溪湖鎮天氣狀況
        <br class="mobile-break">
        <small class="source-note">(資料來源：氣象署)</small>
      </h2>

      <div class="weather-grid">
        <div class="weather-cell"><img id="weatherIcon" src="" alt="天氣"><span>天氣：<span id="weatherDesc">—</span></span></div>
        <div class="weather-cell"><img src="https://img.icons8.com/emoji/48/thermometer-emoji.png"><span>氣溫：<span id="weatherTemp">—</span> °C</span></div>
        <div class="weather-cell"><img src="https://img.icons8.com/color/48/humidity.png"><span>濕度：<span id="weatherHumi">—</span> %</span></div>
        <div class="weather-cell"><img src="https://img.icons8.com/emoji/48/umbrella-with-rain-drops.png"><span>降雨量：<span id="rainfall">—</span> mm</span></div>
      </div>
    </section>

    <section class="panel">
      <h2>木鱉果園土壤溫溼度感測器</h2>
      <div class="sensor-grid">
        <div class="station-card">
          <div class="station-badge">第一站</div>
          <div class="sensor-item">
            <img src="https://img.icons8.com/emoji/48/thermometer-emoji.png">
            <div><span class="sensor-label">溫度 (°C)</span><span class="sensor-value" id="s1Temp">—</span></div>
          </div>
          <div class="sensor-item">
            <img src="https://img.icons8.com/color/48/humidity.png">
            <div><span class="sensor-label">含水率 (%)</span><span class="sensor-value" id="s1Moisture">—</span></div>
          </div>
        </div>

        <div class="sensor-divider"></div>

        <div class="station-card">
          <div class="station-badge">第二站</div>
          <div class="sensor-item">
            <img src="https://img.icons8.com/emoji/48/thermometer-emoji.png">
            <div><span class="sensor-label">溫度 (°C)</span><span class="sensor-value" id="s2Temp">—</span></div>
          </div>
          <div class="sensor-item">
            <img src="https://img.icons8.com/color/48/humidity.png">
            <div><span class="sensor-label">含水率 (%)</span><span class="sensor-value" id="s2Moisture">—</span></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div class="table-wrap">
    <div class="table-title">
      <h3>文亮木鱉果園土壤數據</h3>
      <div class="depth-buttons">
        <button class="btn" id="btnRefresh">立即更新</button>
        <button class="btn" id="btnFullscreen">全螢幕</button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>項目</th>
          <th>EC值<span class="unit">µS/cm</span></th>
          <th>pH值<span class="unit">pH</span></th>
          <th>氮 N<span class="unit">mg/kg</span></th>
          <th>磷 P<span class="unit">mg/kg</span></th>
          <th>鉀 K<span class="unit">mg/kg</span></th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="6">資料讀取中...</td></tr>
      </tbody>
    </table>

    <div class="footer-line" id="footerInfo">
      氣象站更新時間：—　｜　第一站讀取時間：—　｜　第二站讀取時間：—　｜　🔄 下次更新倒數：—
    </div>
  </div>
</div>

<script>
const CONFIG = {
  // ThingSpeak：文亮木鱉果園第一站
  channel1Id: "3233666",
  channel1ReadKey: "V409M70T5K7YCMBM",

  // ThingSpeak：文亮木鱉果園第二站
  channel2Id: "3344832",
  channel2ReadKey: "CAIBSPDQF9R75W2L",

  // 氣象署 API
  cwaAuth: "CWA-4A8A0D9D-95EA-4DA0-A62C-2DC7A8909F06",

  // 彰化縣溪湖鎮附近自動氣象站
  cwaStation: "C0G810",

  autoRefreshMinutes: 6
};

/*
  ThingSpeak 欄位設定：
  field1 = 土壤溫度 °C
  field2 = 土壤含水率 %
  field3 = EC 值 µS/cm
  field4 = pH 值
  field5 = 氮 N mg/kg
  field6 = 磷 P mg/kg
  field7 = 鉀 K mg/kg
*/

function pad(n){return n<10?'0'+n:n}
function nowStr(){const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`}
function dateStr(){const d=new Date();const w=['日','一','二','三','四','五','六'][d.getDay()];return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}（週${w}）`}
function roundInt(x){if(x==null||x==='')return'—';const n=Number(x);return isFinite(n)?Math.round(n):String(x);}
function round1(x){if(x==null||x==='')return'—';const n=Number(x);return isFinite(n)?n.toFixed(1):String(x);}
function formatTime(timeString){
  if(!timeString)return "—";
  const d=new Date(timeString);
  if(Number.isNaN(d.getTime()))return timeString;
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

let weatherTime="—";
let station1Time="—";
let station2Time="—";
let station1Data=null;
let station2Data=null;
let remainingSec = CONFIG.autoRefreshMinutes*60;
const footer=document.getElementById("footerInfo");

function updateFooter(){
  const m=Math.floor(remainingSec/60),s=pad(remainingSec%60);
  footer.textContent=`氣象站更新時間：${weatherTime}　｜　第一站讀取時間：${station1Time}　｜　第二站讀取時間：${station2Time}　｜　🔄 下次更新倒數：${m}:${s}`;
}

(function clockTick(){
  document.getElementById("mainClock").textContent=nowStr();
  document.getElementById("dateBox").textContent=dateStr();
  requestAnimationFrame(()=>setTimeout(clockTick,250));
})();

setInterval(()=>{
  remainingSec--;
  if(remainingSec<=0){
    remainingSec=CONFIG.autoRefreshMinutes*60;
    refreshAll();
  }
  updateFooter();
},1000);

function getThingSpeakUrl(channelId, readKey){
  return `https://api.thingspeak.com/channels/${channelId}/feeds/last.json?api_key=${readKey}&t=${Date.now()}`;
}

async function refreshThingSpeak(){
  try{
    const url1=getThingSpeakUrl(CONFIG.channel1Id, CONFIG.channel1ReadKey);
    const url2=getThingSpeakUrl(CONFIG.channel2Id, CONFIG.channel2ReadKey);

    const [res1,res2]=await Promise.all([
      fetch(url1,{cache:'no-store'}),
      fetch(url2,{cache:'no-store'})
    ]);

    if(!res1.ok)throw new Error("第一站 ThingSpeak 讀取失敗："+res1.status);
    if(!res2.ok)throw new Error("第二站 ThingSpeak 讀取失敗："+res2.status);

    station1Data=await res1.json();
    station2Data=await res2.json();

    station1Time=formatTime(station1Data.created_at);
    station2Time=formatTime(station2Data.created_at);

    renderThingSpeakTable();
    updateSensorSummary();
    updateFooter();
  }catch(e){
    console.warn("⚠️ ThingSpeak 錯誤:",e);
    const tbody=document.getElementById("tbody");
    tbody.innerHTML=`<tr><td colspan="6" class="warn">ThingSpeak 資料讀取失敗，請檢查 Channel ID、Read API Key 或網路連線</td></tr>`;
  }
}

function getStationValues(data){
  return {
    soilTemp: data?.field1,
    soilMoisture: data?.field2,
    ec: data?.field3,
    ph: data?.field4,
    nitrogen: data?.field5,
    phosphorus: data?.field6,
    potassium: data?.field7
  };
}

function renderThingSpeakTable(){
  const tbody=document.getElementById("tbody");
  tbody.innerHTML="";

  if(!station1Data || !station2Data){
    tbody.innerHTML=`<tr><td colspan="6">資料讀取中...</td></tr>`;
    return;
  }

  const stations=[
    {name:"木鱉果第一站", data:station1Data},
    {name:"木鱉果第二站", data:station2Data}
  ];

  stations.forEach(st=>{
    const v=getStationValues(st.data);
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${st.name}</td>
      <td>${roundInt(v.ec)}</td>
      <td>${round1(v.ph)}</td>
      <td>${roundInt(v.nitrogen)}</td>
      <td>${roundInt(v.phosphorus)}</td>
      <td>${roundInt(v.potassium)}</td>`;
    tbody.appendChild(tr);
  });
}

function updateSensorSummary(){
  if(station1Data){
    const v1=getStationValues(station1Data);
    const m1=Number(v1.soilMoisture);
    document.getElementById("s1Temp").textContent=roundInt(v1.soilTemp);
    document.getElementById("s1Moisture").textContent=roundInt(v1.soilMoisture);
    document.getElementById("s1Moisture").className=!Number.isNaN(m1)&&m1<25?"sensor-value":"sensor-value";
  }
  if(station2Data){
    const v2=getStationValues(station2Data);
    const m2=Number(v2.soilMoisture);
    document.getElementById("s2Temp").textContent=roundInt(v2.soilTemp);
    document.getElementById("s2Moisture").textContent=roundInt(v2.soilMoisture);
    document.getElementById("s2Moisture").className=!Number.isNaN(m2)&&m2<25?"sensor-value":"sensor-value";
  }
}

async function refreshWeather(){
  try{
    const url=`https://opendata.cwa.gov.tw/api/v1/rest/datastore/O-A0001-001?Authorization=${CONFIG.cwaAuth}&format=JSON&StationId=${CONFIG.cwaStation}`;
    const res=await fetch(url,{cache:'no-store'});
    const js=await res.json();
    const st=js.records?.Station?.[0];
    const w=st?.WeatherElement||{};

    document.getElementById("weatherDesc").textContent=w.Weather||"—";
    document.getElementById("weatherTemp").textContent=roundInt(w.AirTemperature);
    document.getElementById("weatherHumi").textContent=roundInt(w.RelativeHumidity);
    document.getElementById("rainfall").textContent=roundInt(w.Now?.Precipitation);
    document.getElementById("weatherIcon").src=w.Weather?.includes("雨")
      ?"https://img.icons8.com/emoji/48/cloud-with-rain.png"
      :"https://img.icons8.com/emoji/48/sun-emoji.png";

    weatherTime=(st?.ObsTime?.DateTime||"").replace("T"," ").slice(0,19) || "—";
    updateFooter();
  }catch(e){
    console.warn("⚠️ 氣象錯誤:",e);
    document.getElementById("weatherDesc").textContent="讀取失敗";
    document.getElementById("weatherTemp").textContent="—";
    document.getElementById("weatherHumi").textContent="—";
    document.getElementById("rainfall").textContent="—";
    document.getElementById("weatherIcon").src="https://img.icons8.com/emoji/48/cloud-emoji.png";
  }
}

async function refreshAll(){
  await Promise.all([refreshThingSpeak(),refreshWeather()]);
  updateFooter();
}

document.getElementById("btnRefresh").onclick=()=>{
  remainingSec=CONFIG.autoRefreshMinutes*60;
  refreshAll();
};
document.getElementById("btnFullscreen").onclick=()=>document.documentElement.requestFullscreen?.();

refreshAll();
</script>
</body>
</html>
