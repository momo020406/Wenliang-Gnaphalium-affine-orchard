<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>文亮木鱉果園 - 即時儀表板 v1.0</title>
<style>
:root{
  --bg:#CDEDC7;
  --panel:#245953;
  --tile:#E7F6E7;
  --text:#0B2D2A;
  --num:#0f172a;
  --ok:#16a34a;
  --radius:18px;
  --gap:14px;
}
html,body{
  height:100%;margin:0;background:var(--bg);
  font-family:"Microsoft JhengHei",system-ui,sans-serif;color:var(--text);
}
.wrap{max-width:1280px;margin:auto;padding:18px;}
header{display:grid;gap:var(--gap);
  grid-template-columns:1.2fr 1fr 1.2fr;align-items:stretch;}
.title{background:#e8f7ee;border:4px solid var(--panel);
  border-radius:var(--radius);display:flex;align-items:center;
  justify-content:center;flex-direction:column;padding:12px;}
.title h1{margin:6px 0 2px 0;font-size:44px;letter-spacing:4px;}
.clock,.datebox{
  background:#fff;border:4px solid var(--panel);
  border-radius:var(--radius);display:flex;align-items:center;
  justify-content:center;flex-direction:column;font-weight:700;}
.clock{font-size:46px;}
.datebox{font-size:36px;font-weight:800;}
.source-note {
  font-size: 50%;
  color: #444;
  font-weight: 500;
  margin-left: 4px;
}
.top-panels{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin-top:var(--gap);}
.panel{background:#fff;border:4px solid var(--panel);border-radius:var(--radius);padding:12px;}
.panel h2{margin:0 0 8px 0;font-size:28px}
.weather-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;background:var(--tile);
  border-radius:14px;padding:12px;align-items:start;justify-items:start;}
.weather-cell{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;line-height:1.4}
.weather-cell img{width:36px;height:36px;}
.env-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--tile);
  border-radius:14px;padding:12px;align-items:center;justify-items:center;}
.env-cell{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;color:var(--num);}
.env-cell img{width:50px;height:50px;}
.env-cell .value{font-size:36px;font-weight:800}
.table-wrap{margin-top:var(--gap);background:#fff;border:4px solid var(--panel);
  border-radius:var(--radius);padding:14px}
.table-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:10px;}
.table-title h3{margin:0;font-size:26px}
.weather-title {line-height: 1.3;}
.source-note {font-size: 55%;color: #444;font-weight: 500;}
.mobile-break {display: none;}
@media (max-width:768px){
  .mobile-break {display: block;}
  .source-note {display: block;text-align: right;margin-top: 2px;}
}
.btn{
  background:var(--panel);
  color:#fff;
  border:none;
  border-radius:999px;
  padding:10px 0;
  width:130px;
  font-size:20px;
  font-weight:800;
  cursor:pointer;
  letter-spacing:1px;
  text-align:center;
}
.btn:active{transform:translateY(1px);}
.depth-btn.active{background:var(--ok);}
table{width:100%;border-collapse:separate;border-spacing:0 10px}
thead th{font-size:18px;color:#334155;text-align:center}
tbody td,thead th{padding:10px 8px}
tbody tr{background:var(--tile);}
tbody tr td{font-size:22px;text-align:center;font-weight:700;color:var(--num)}
tbody tr td:first-child{font-weight:800;color:#1f2937}
.footer-line{color:#2563eb;font-size:15px;margin-top:10px;text-align:center;
  border-top:2px solid #a3bfa3;padding-top:6px;}
.warn{color:#dc2626;font-weight:900;}
@media (max-width:768px){
  header{grid-template-columns:1fr !important;}
  .title h1{font-size:32px}
  .clock{font-size:32px}
  .datebox{font-size:24px}
  .top-panels{grid-template-columns:1fr;}
  .env-grid{grid-template-columns:1fr;}
  tbody tr td{font-size:18px}
  .table-title {flex-direction: column;align-items: center;gap: 12px;}
  .depth-buttons {display: grid;grid-template-columns: repeat(2, 1fr);gap: 10px 14px;justify-items: center;}
  .btn {width: 120px;font-size: 18px;}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="datebox" id="dateBox">--</div>
    <div class="title"><h1>文亮木鱉果園</h1><small>Real-time Dashboard</small></div>
    <div class="clock"><div id="mainClock">00:00:00</div></div>
  </header>

  <div class="top-panels">
    <section class="panel">
      <h2 class="weather-title">
        彰化 溪湖鎮天氣狀況
        <br class="mobile-break">
        <small class="source-note">(資料來源：氣象署)</small>
      </h2>

      <div class="weather-grid">
        <div class="weather-cell"><img id="weatherIcon" src="" alt="天氣"><span>天氣：<span id="weatherDesc">—</span></span></div>
        <div class="weather-cell"><img src="https://img.icons8.com/emoji/48/thermometer-emoji.png"><span>氣溫：<span id="weatherTemp">—</span> °C</span></div>
        <div class="weather-cell"><img src="https://img.icons8.com/color/48/humidity.png"><span>濕度：<span id="weatherHumi">—</span> %</span></div>
        <div class="weather-cell"><img src="https://img.icons8.com/emoji/48/umbrella-with-rain-drops.png"><span>降雨量：<span id="rainfall">—</span> mm</span></div>
      </div>
    </section>

    <section class="panel">
      <h2>木鱉果園溫溼度感測器</h2>
      <div class="env-grid">
        <div class="env-cell"><img src="https://img.icons8.com/emoji/48/thermometer-emoji.png"><div><span class="label">第一站溫度 (°C)</span><br><span class="value" id="envTemp">—</span></div></div>
        <div class="env-cell"><img src="https://img.icons8.com/color/48/humidity.png"><div><span class="label">第一站含水率 (%)</span><br><span class="value" id="envHumi">—</span></div></div>
      </div>
    </section>
  </div>

  <div class="table-wrap">
    <div class="table-title">
      <h3>文亮木鱉果園土壤數據</h3>
      <div class="depth-buttons"> 
        <button class="btn depth-btn active" data-depth="Surface">表面層</button>
        <button class="btn depth-btn" data-depth="15cm">15 cm 層</button>
        <button class="btn depth-btn" data-depth="25cm">25 cm 層</button>
        <button class="btn" id="btnFullscreen">全螢幕</button>
      </div>
    </div>

    <table>
      <thead>
        <tr><th>項目</th><th>溫度 (°C)</th><th>含水率 (%)</th><th>氮 (N)</th><th>磷 (P)</th><th>鉀 (K)</th></tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="6">資料讀取中...</td></tr>
      </tbody>
    </table>

    <div class="footer-line" id="footerInfo">
      氣象站更新時間：—　｜　第一站讀取時間：—　｜　第二站讀取時間：—　｜　🔄 下次更新倒數：—
    </div>
  </div>
</div>

<script>
const CONFIG = {
  // ThingSpeak：文亮木鱉果園第一站
  channel1Id: "3233666",
  channel1ReadKey: "V409M70T5K7YCMBM",

  // ThingSpeak：文亮木鱉果園第二站
  channel2Id: "3344832",
  channel2ReadKey: "CAIBSPDQF9R75W2L",

  // 氣象署 API
  cwaAuth: "CWA-4A8A0D9D-95EA-4DA0-A62C-2DC7A8909F06",

  // 彰化縣溪湖鎮附近自動氣象站。
  // 若讀不到，可到氣象署開放資料查詢附近站號後替換。
  cwaStation: "C0G810",

  autoRefreshMinutes: 6
};

function pad(n){return n<10?'0'+n:n}
function nowStr(){const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`}
function dateStr(){const d=new Date();const w=['日','一','二','三','四','五','六'][d.getDay()];return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}（週${w}）`}
function roundInt(x){if(x==null||x==='')return'—';const n=Number(x);return isFinite(n)?Math.round(n):String(x);}
function formatTime(timeString){
  if(!timeString)return "—";
  const d=new Date(timeString);
  if(Number.isNaN(d.getTime()))return timeString;
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

let weatherTime="—";
let station1Time="—";
let station2Time="—";
let station1Data=null;
let station2Data=null;
let currentDepth="Surface";
let remainingSec = CONFIG.autoRefreshMinutes*60;
const footer=document.getElementById("footerInfo");

function updateFooter(){
  const m=Math.floor(remainingSec/60),s=pad(remainingSec%60);
  footer.textContent=`氣象站更新時間：${weatherTime}　｜　第一站讀取時間：${station1Time}　｜　第二站讀取時間：${station2Time}　｜　🔄 下次更新倒數：${m}:${s}`;
}

// 即時時鐘
(function clockTick(){
  document.getElementById("mainClock").textContent=nowStr();
  document.getElementById("dateBox").textContent=dateStr();
  requestAnimationFrame(()=>setTimeout(clockTick,250));
})();

// 倒數更新
setInterval(()=>{
  remainingSec--;
  if(remainingSec<=0){
    remainingSec=CONFIG.autoRefreshMinutes*60;
    refreshAll();
  }
  updateFooter();
},1000);

function getThingSpeakUrl(channelId, readKey){
  return `https://api.thingspeak.com/channels/${channelId}/feeds/last.json?api_key=${readKey}&t=${Date.now()}`;
}

async function refreshThingSpeak(){
  try{
    const url1=getThingSpeakUrl(CONFIG.channel1Id, CONFIG.channel1ReadKey);
    const url2=getThingSpeakUrl(CONFIG.channel2Id, CONFIG.channel2ReadKey);

    const [res1,res2]=await Promise.all([
      fetch(url1,{cache:'no-store'}),
      fetch(url2,{cache:'no-store'})
    ]);

    if(!res1.ok)throw new Error("第一站 ThingSpeak 讀取失敗："+res1.status);
    if(!res2.ok)throw new Error("第二站 ThingSpeak 讀取失敗："+res2.status);

    station1Data=await res1.json();
    station2Data=await res2.json();

    station1Time=formatTime(station1Data.created_at);
    station2Time=formatTime(station2Data.created_at);

    renderThingSpeakTable(currentDepth);
    updateEnvSummary();
    updateFooter();
  }catch(e){
    console.warn("⚠️ ThingSpeak 錯誤:",e);
    const tbody=document.getElementById("tbody");
    tbody.innerHTML=`<tr><td colspan="6" class="warn">ThingSpeak 資料讀取失敗，請檢查 Channel ID、Read API Key 或網路連線</td></tr>`;
  }
}

function getStationValues(data, depth){
  // 目前兩個 ThingSpeak Channel 都以 field1~field5 顯示。
  // field1=溫度、field2=含水率、field3=氮、field4=磷、field5=鉀。
  // 如果不同深度有不同 Channel 或不同欄位，可在這裡擴充。
  return {
    soilTemp: data?.field1,
    soilMoisture: data?.field2,
    nitrogen: data?.field3,
    phosphorus: data?.field4,
    potassium: data?.field5
  };
}

function renderThingSpeakTable(depth="Surface"){
  const tbody=document.getElementById("tbody");
  tbody.innerHTML="";

  if(!station1Data || !station2Data){
    tbody.innerHTML=`<tr><td colspan="6">資料讀取中...</td></tr>`;
    return;
  }

  const stations=[
    {name:"木鱉果第一站", data:station1Data},
    {name:"木鱉果第二站", data:station2Data}
  ];

  stations.forEach(st=>{
    const v=getStationValues(st.data, depth);
    const moistureNum=Number(v.soilMoisture);
    const moistureClass=!Number.isNaN(moistureNum)&&moistureNum<25?"warn":"";

    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${st.name}</td>
      <td>${roundInt(v.soilTemp)}</td>
      <td class="${moistureClass}">${roundInt(v.soilMoisture)}</td>
      <td>${roundInt(v.nitrogen)}</td>
      <td>${roundInt(v.phosphorus)}</td>
      <td>${roundInt(v.potassium)}</td>`;
    tbody.appendChild(tr);
  });
}

function updateEnvSummary(){
  if(!station1Data)return;
  document.getElementById("envTemp").textContent=roundInt(station1Data.field1);
  document.getElementById("envHumi").textContent=roundInt(station1Data.field2);
}

// 氣象資料：彰化溪湖鎮附近氣象站
async function refreshWeather(){
  try{
    const url=`https://opendata.cwa.gov.tw/api/v1/rest/datastore/O-A0001-001?Authorization=${CONFIG.cwaAuth}&format=JSON&StationId=${CONFIG.cwaStation}`;
    const res=await fetch(url,{cache:'no-store'});
    const js=await res.json();
    const st=js.records?.Station?.[0];
    const w=st?.WeatherElement||{};

    document.getElementById("weatherDesc").textContent=w.Weather||"—";
    document.getElementById("weatherTemp").textContent=roundInt(w.AirTemperature);
    document.getElementById("weatherHumi").textContent=roundInt(w.RelativeHumidity);
    document.getElementById("rainfall").textContent=roundInt(w.Now?.Precipitation);
    document.getElementById("weatherIcon").src=w.Weather?.includes("雨")
      ?"https://img.icons8.com/emoji/48/cloud-with-rain.png"
      :"https://img.icons8.com/emoji/48/sun-emoji.png";

    weatherTime=(st?.ObsTime?.DateTime||"").replace("T"," ").slice(0,19) || "—";
    updateFooter();
  }catch(e){
    console.warn("⚠️ 氣象錯誤:",e);
    document.getElementById("weatherDesc").textContent="讀取失敗";
    document.getElementById("weatherTemp").textContent="—";
    document.getElementById("weatherHumi").textContent="—";
    document.getElementById("rainfall").textContent="—";
    document.getElementById("weatherIcon").src="https://img.icons8.com/emoji/48/cloud-emoji.png";
  }
}

// 層級切換
// 目前 ThingSpeak 雙 Channel 版本先共用 field1~field5。
// 若未來每個深度都有獨立 Channel，可在 getStationValues() 裡面擴充。
document.querySelectorAll(".depth-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".depth-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentDepth=btn.getAttribute("data-depth");
    renderThingSpeakTable(currentDepth);
  });
});

async function refreshAll(){
  await Promise.all([refreshThingSpeak(),refreshWeather()]);
  updateFooter();
}

// 初始化
refreshAll();
document.getElementById("btnFullscreen").onclick=()=>document.documentElement.requestFullscreen?.();
</script>
</body>
</html>
